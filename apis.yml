aid: axiom-space
name: Axiom Space
description: >-
  Axiom Space, Inc. is a privately funded American space infrastructure developer
  headquartered in Houston, Texas, founded in 2016 by Kam Ghaffarian and former NASA
  International Space Station Program Manager Michael Suffredini. The company is
  building Axiom Station, the world's first commercial space station and planned
  successor to the ISS, and has flown private astronaut missions to the ISS (Ax-1
  through Ax-4). Axiom Space also develops the Axiom Extravehicular Mobility Unit
  (AxEMU) spacesuit for NASA's return to the lunar surface, and sells human
  spaceflight, microgravity research, in-space manufacturing, and Orbital Data Center
  services (in-orbit cloud compute, with the ODC T1 node built alongside Kepler
  Communications and Skyloom Global). As of this enrichment pass Axiom Space publishes
  no public developer API, SDK, developer portal, or machine-readable API contract —
  every offering is transacted through direct enterprise, agency, and government
  engagement, and its only public code presence is a two-repository GitHub
  organization holding forks of NASA simulation software (Trick and GUNNS).
